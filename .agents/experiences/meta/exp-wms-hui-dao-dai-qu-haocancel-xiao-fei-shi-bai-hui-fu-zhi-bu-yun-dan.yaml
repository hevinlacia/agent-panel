summary: "「回到待取号」回退时clearWaybillInfo清空printDataId/carrierService；两条cancel MQ并发消费（用户10秒内重复操作，validateForRollback不拒绝ROLLBACK单）后者对同一单validateCancel命中IN_POOL返回MSG_SHIP_0033，走WMS-072恢复分支只恢复processType/primaryWaybillCode/waybillGetStatus三字段；打印侧WaybillPrintLogServiceImpl用carrierService+_CLOUD拼printType，carrierService为空→printType=NORMAL→不调PDD等平台云打印组件。设计教训：清空面(WMS-018,7字段)与恢复面(WMS-072,3字段)不成对，'补一半'制造有单号无打印数据的中间态。"
